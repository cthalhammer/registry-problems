# Generated by `manage.py build_problems_package`. Do not edit by hand.
#
# lakefile.toml rather than lakefile.lean: a .lean lakefile is an arbitrary
# Lean program that lake executes, and the verifier rejects submissions that
# carry one. The package every submission depends on should hold itself to
# that same rule.
name = "RegistryProblems"
defaultTargets = ["RegistryProblems"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# One module per statement, so a submission imports only the statement it
# targets, and a statement that stops building takes nothing else with it.
[[lean_lib]]
name = "RegistryProblems"
globs = ["RegistryProblems.+"]
